buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        // Fallback to the legacy files mirror (https). The old http:// URL
        // now redirects, plain http is blocked by modern Gradle/JDKs.
        maven {
            name = "forge-files-fallback"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            // The old Sonatype OSS snapshot host was sunset; snapshots live on Central Portal now.
            name = "central-snapshots"
            url = "https://central.sonatype.com/repository/maven-snapshots/"
        }
    }
    dependencies {
        // NOTE: ForgeGradle 1.2 has no fixed release; 1.2-SNAPSHOT is the only
        // available line for the 1.7.10 toolchain. It must be resolved from
        // the Forge maven above (https). Do not pin to a release version.
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: '${name}'

version = "1.0"
group= "com.yourname.modid" // https://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "modid"

minecraft {
    version = "${version}"
    runDir = "eclipse"
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // https://docs.gradle.org/current/userguide/artifact_dependencies_tutorial.html
    // https://docs.gradle.org/current/userguide/dependency_management.html

}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
