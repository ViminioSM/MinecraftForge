# Gradle wrapper configuration (project root).
# NOTE: gradlew/gradlew.bat at the repo root bootstrap from
# fml/gradle/wrapper/gradle-wrapper.jar (CLASSPATH=$APP_HOME/fml/gradle/...).
# This root wrapper is provided as a convenience mirror so standard tooling
# (`gradle/wrapper/`) resolves the same toolchain without guessing.
# Distribution pinned to Gradle 2.14.1: last 2.x line, Java 8 compatible,
# works with ForgeGradle 1.2-SNAPSHOT used by the 1.7.10 toolchain.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-2.14.1-bin.zip
